# The API and a directory to sign in against. The database is not here on purpose: it is yours to
# run, so nothing in a container owns your data. Point DB_HOST at wherever PostgreSQL is.
name: json-store-api

services:
  ldap:
    image: osixia/openldap:1.5.0
    command: ['--copy-service']
    environment:
      LDAP_ORGANISATION: Example
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
    volumes:
      # Users and groups for local testing: alice (admins, developers) and bob (developers).
      - ./deploy/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/10-users.ldif:ro
    ports:
      - '${LDAP_PORT:-389}:389'
    healthcheck:
      test: ['CMD-SHELL', 'ldapsearch -x -H ldap://localhost -b dc=example,dc=com -D "cn=admin,dc=example,dc=com" -w "$${LDAP_ADMIN_PASSWORD:-admin}" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    image: json-store-api:${APP_VERSION:-dev}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # host.docker.internal is the machine running Docker, so this reaches a PostgreSQL you
      # started yourself. That server has to accept connections from outside localhost.
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-jsonstore}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      LDAP_URL: ldap://ldap:389
      LDAP_BASE: dc=example,dc=com
      LDAP_MANAGER_DN: cn=admin,dc=example,dc=com
      LDAP_MANAGER_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-please-32+}
      JWT_TTL: ${JWT_TTL:-PT8H}
      JWT_MAX_SESSION: ${JWT_MAX_SESSION:-PT24H}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      ldap:
        condition: service_healthy
    restart: unless-stopped
