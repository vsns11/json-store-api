# Local development for this repo on its own: a database and the API.
# The web app is a separate repository and talks to this over HTTP.
name: json-store-api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-jsonstore}
      POSTGRES_USER: ${DB_USER:-jsonstore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jsonstore}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - json-store-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-jsonstore} -d ${DB_NAME:-jsonstore}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: json-store-api:${APP_VERSION:-dev}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-jsonstore}
      DB_USER: ${DB_USER:-jsonstore}
      DB_PASSWORD: ${DB_PASSWORD:-jsonstore}
      # Origin the web app is served from — it calls this API cross-origin.
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  json-store-data:
