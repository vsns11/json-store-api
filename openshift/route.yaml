# Only needed when the API is reached on its own hostname. If the web app's Route already
# forwards /api to this Service, delete this file — same-origin avoids CORS entirely.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: json-store-api
  annotations:
    haproxy.router.openshift.io/rate-limit-connections: 'true'
    haproxy.router.openshift.io/rate-limit-connections.rate-http: '100'
spec:
  host: json-store-api.apps.example.com
  to:
    kind: Service
    name: json-store-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
