spring:
  application:
    name: json-store
  profiles:
    # With no profile chosen, this is a developer's own machine; see the local document at the end.
    # Choosing any profile at all — prod, staging, anything — turns every development fallback off.
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jsonstore}
    username: ${DB_USER:${user.name}}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: json-store-pool
      # Pool size is per instance: total connections = replicas x maximum-pool-size.
      # Keep the product below PostgreSQL's max_connections, or front the database with PgBouncer.
      maximum-pool-size: ${DB_POOL_MAX:16}
      minimum-idle: ${DB_POOL_MIN:4}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that it matches the mapping.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        query.in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ldap:
    # spring.ldap.urls is deliberately unset here: outside production the embedded server below
    # supplies it. Production sets it from LDAP_URL (see application-prod.yml).
    base: ${LDAP_BASE:dc=example,dc=com}
    username: ${LDAP_MANAGER_DN:}
    password: ${LDAP_MANAGER_PASSWORD:}
    # Without these a directory that stops answering holds a sign-in request, and its thread, forever.
    base-environment:
      "[com.sun.jndi.ldap.connect.timeout]": ${LDAP_CONNECT_TIMEOUT_MS:5000}
      "[com.sun.jndi.ldap.read.timeout]": ${LDAP_READ_TIMEOUT_MS:10000}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  threads:
    virtual:
      # Off by default: the PostgreSQL driver still pins carrier threads on Java 21.
      enabled: ${VIRTUAL_THREADS:false}

  lifecycle:
    timeout-per-shutdown-phase: 25s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1024
  http2:
    enabled: true
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_THREADS:20}
    accept-count: 200
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    connection-timeout: 5s
    # Trust the load balancer's forwarded headers for correct client IPs and scheme.
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

# Actuator listens on its own port so probes and metrics are never publicly routable.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  # The description follows the same rules as the API: a token is needed for everything but sign-in.
  api-docs:
    path: /v3/api-docs

app:
  # Example profiles are inserted into an empty database under the local profile only.
  seed-examples: ${SEED_EXAMPLES:true}
  security:
    jwt:
      # Must be at least 32 characters. There is deliberately no default here: only the local profile
      # below has one, so a deployment that forgets JWT_SECRET fails to start instead of signing
      # tokens with a secret published in this repository.
      secret: ${JWT_SECRET}
      # How long one token lasts. The browser renews it before it runs out, but only for as long
      # as max-session allows, counted from the moment the password was typed.
      ttl: ${JWT_TTL:PT8H}
      max-session: ${JWT_MAX_SESSION:PT24H}
    ldap:
      # Bind pattern for the username. Leave empty to search instead.
      user-dn-patterns: ${LDAP_USER_DN_PATTERNS:uid={0},ou=people}
      user-search-base: ${LDAP_USER_SEARCH_BASE:}
      user-search-filter: ${LDAP_USER_SEARCH_FILTER:(uid={0})}
      # Group membership becomes a role: cn=admins -> ROLE_ADMINS.
      group-search-base: ${LDAP_GROUP_SEARCH_BASE:ou=groups}
      group-search-filter: ${LDAP_GROUP_SEARCH_FILTER:(member={0})}
    access:
      # Directory groups (their cn, any case, comma-separated) that may use JSON Store. Viewers read;
      # editors also create and change profiles; admins also delete them and run maintenance. An account
      # in none of these is refused at sign-in, and with none mapped at all the API does not start.
      viewer-groups: ${ROLE_VIEWER_GROUPS:}
      editor-groups: ${ROLE_EDITOR_GROUPS:}
      admin-groups: ${ROLE_ADMIN_GROUPS:}
      # Recorded as the author of each change, as the directory spells it rather than as it was typed.
      username-attribute: ${LDAP_USERNAME_ATTRIBUTE:uid}
      # Wrong passwords one username may try within the window, per replica, before sign-in pauses for
      # that name. The directory's own lockout policy still applies behind this.
      max-failed-sign-ins: ${LOGIN_MAX_FAILURES:5}
      failed-sign-in-window: ${LOGIN_FAILURE_WINDOW:PT5M}
  cors:
    # Comma-separated list of the origins the browser app is served from. An entry may be an exact
    # origin or a pattern, e.g. http://localhost:[*] for any port while developing. Production
    # names its real origins (see application-prod.yml).
    allowed-origins: ${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
  limits:
    # Rejects oversized inputs before they reach the database. The payload limit is measured on the
    # minified inputs; the request limit is what a body may announce on the wire, and is checked
    # before anything is read, so a client cannot make a replica parse a hundred megabytes.
    max-payload-bytes: ${MAX_PAYLOAD_BYTES:1048576}
    max-request-bytes: ${MAX_REQUEST_BYTES:8388608}
    max-page-size: ${MAX_PAGE_SIZE:100}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
  pattern:
    # requestId comes from RequestIdFilter and ties log lines to a single HTTP call.
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId:-        }] %-40.40logger{39} : %m%n'

---
# A developer's own machine. This runs when no profile is chosen, so `./mvnw spring-boot:run` needs
# nothing set up. Naming any profile leaves it off — which is the point: this used to apply to every
# profile except `prod`, so a deployment started as `staging` signed tokens with the development
# secret and let alice/secret in as an administrator.
#
# An in-process LDAP server starts with the test directory in src/main/resources/ldap/users.ldif;
# every account's password is "secret". alice is an admin, bob an editor and dave a viewer; carol is in
# no mapped group, so she is refused.
spring:
  config:
    activate:
      on-profile: local
  ldap:
    embedded:
      base-dn: dc=example,dc=com
      ldif: classpath:ldap/users.ldif
      port: ${LDAP_EMBEDDED_PORT:8389}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:development-only-secret-not-for-production-use}
    access:
      viewer-groups: ${ROLE_VIEWER_GROUPS:auditors}
      editor-groups: ${ROLE_EDITOR_GROUPS:developers}
      admin-groups: ${ROLE_ADMIN_GROUPS:admins}
