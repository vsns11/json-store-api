name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Integration tests start PostgreSQL through Testcontainers, which the runner provides.
      - run: ./mvnw -B verify
      - uses: azure/setup-helm@v4
      # The chart refuses to render without an image tag and credentials, so lint supplies stand-ins.
      - run: >-
          helm lint chart --set image.tag=ci --set config.ROLE_EDITOR_GROUPS=ci
          --set secrets.DB_USER=ci --set secrets.DB_PASSWORD=ci
          --set secrets.LDAP_MANAGER_DN=ci --set secrets.LDAP_MANAGER_PASSWORD=ci
          --set secrets.JWT_SECRET=ci-only-secret-that-is-long-enough-to-sign
      - run: docker build -t json-store-api:${{ github.sha }} .
