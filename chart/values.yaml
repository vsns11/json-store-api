# Everything the chart can be told. Only `image.repository` and the values under
# `config` and `secrets` normally need changing.

replicaCount: 3

image:
  repository: ghcr.io/your-org/json-store-api
  tag: ""              # required: the exact image this release runs, never a moving tag
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 8080

# Non-secret settings, rendered into a ConfigMap.
config:
  SPRING_PROFILES_ACTIVE: prod
  DB_HOST: postgresql
  DB_PORT: "5432"
  DB_NAME: jsonstore
  DB_POOL_MAX: "8"
  MAX_PAYLOAD_BYTES: "1048576"
  MAX_REQUEST_BYTES: "8388608"
  JWT_TTL: PT8H
  JWT_MAX_SESSION: PT24H
  CORS_ORIGINS: ""     # leave empty when a Route or Ingress serves the UI on this host
  LDAP_URL: ldaps://ldap.example.com:636
  LDAP_BASE: dc=example,dc=com
  LDAP_USER_DN_PATTERNS: uid={0},ou=people
  LDAP_GROUP_SEARCH_BASE: ou=groups
  LDAP_CONNECT_TIMEOUT_MS: "5000"
  LDAP_READ_TIMEOUT_MS: "10000"
  # Directory groups (their cn, comma-separated) that may use JSON Store. At least one is required:
  # the chart refuses to render without, and anyone in none of them is refused at sign-in.
  ROLE_VIEWER_GROUPS: ""
  ROLE_EDITOR_GROUPS: ""
  ROLE_ADMIN_GROUPS: ""
  # Wrong passwords per username, per replica, before sign-in pauses for that name.
  LOGIN_MAX_FAILURES: "5"
  LOGIN_FAILURE_WINDOW: PT5M

# Database migrations. With the Job on, Helm applies them before an install or upgrade rolls out,
# using the same image run with --migrate-only, and the API pods only check the schema matches. A
# migration that fails then stops the release instead of crash-looping new pods. With it off, each
# starting pod migrates — Flyway locks, so that is safe, but a failure is found during the rollout.
migrations:
  job:
    enabled: true
    backoffLimit: 1
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

# Which template catalogue the form offers. Leave both empty for the one built into the image,
# templates/catalog.json.
catalog:
  # A catalogue shipped inside the image, by name: "tmf702" serves templates/tmf702-catalog.json.
  builtin: ""
  # Or your own: an existing ConfigMap holding the catalogue, and the key it is stored under. It is
  # mounted read-only and checked at startup, so a malformed catalogue fails the rollout, not a user.
  existingConfigMap: ""
  key: catalog.json
  # The chart cannot see inside a ConfigMap it does not own, so editing one does not restart the
  # pods by itself. Change this to any new value when you do, and they roll.
  revision: ""

# Credentials. In a real cluster set `existingSecret` and leave these empty, so
# nothing sensitive is ever written into a values file.
existingSecret: ""
secrets:
  DB_USER: ""
  DB_PASSWORD: ""
  LDAP_MANAGER_DN: ""
  LDAP_MANAGER_PASSWORD: ""
  JWT_SECRET: ""       # at least 32 characters

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 65

# What the database can give this service. A release whose connection pools could exceed it at full
# scale is refused at render time, because otherwise the autoscaler adds pods exactly when load
# peaks and each new one fails readiness for want of a connection.
# The check is DB_POOL_MAX x (the most replicas + 1 surge pod) <= maxConnections - reservedConnections.
database:
  maxConnections: 100
  reservedConnections: 20

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# OpenShift Route. Use `ingress` instead on plain Kubernetes.
route:
  enabled: false
  host: ""
  path: /api
  annotations: {}
  tls:
    termination: edge
  # A second Route for the sign-in endpoint alone, so the router can limit how often one client
  # address may try it. The API's own pause counts per username, per replica; this counts per client.
  signInRateLimit:
    enabled: true
    annotations:
      haproxy.router.openshift.io/rate-limit-connections: "true"
      haproxy.router.openshift.io/rate-limit-connections.rate-http: "10"

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /api
  annotations: {}
  tls:
    enabled: true
    secretName: json-store-tls
  # A second Ingress for the sign-in endpoint alone, limited per client address by ingress-nginx.
  # Other controllers ignore these annotations; set your own under signInRateLimit.annotations.
  signInRateLimit:
    enabled: true
    requestsPerMinute: 10
    annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
