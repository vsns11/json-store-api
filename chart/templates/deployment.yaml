{{- $replicas := .Values.autoscaling.enabled | ternary .Values.autoscaling.maxReplicas .Values.replicaCount | int }}
{{- $pool := .Values.config.DB_POOL_MAX | int }}
{{- $budget := sub (.Values.database.maxConnections | int) (.Values.database.reservedConnections | int) }}
{{- if gt (mul $pool (add1 $replicas)) $budget }}
{{- fail (printf "DB_POOL_MAX %d x %d pods (%d replicas + 1 surge) = %d connections, over the %d this database allows (database.maxConnections - database.reservedConnections). Lower the pool or the replicas, or put PgBouncer in front." $pool (add1 $replicas) $replicas (mul $pool (add1 $replicas)) $budget) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "json-store-api.fullname" . }}
  labels: {{- include "json-store-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "json-store-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "json-store-api.labels" . | nindent 8 }}
      annotations:
        # Restart the pods when the settings change, not only when the image does.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/catalog: {{ .Values.catalog | toYaml | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required: pin the exact image this release runs" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          {{- with (include "json-store-api.catalogLocation" .) }}
          env:
            - name: APP_TEMPLATES_CATALOG
              value: {{ . | quote }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "json-store-api.fullname" . }}
            - secretRef:
                name: {{ include "json-store-api.secretName" . }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
          lifecycle:
            preStop:
              # Let the router stop sending traffic before shutdown begins.
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            # No runAsUser: OpenShift assigns one from the namespace range.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.catalog.existingConfigMap }}
            - name: catalog
              mountPath: /etc/json-store/catalog
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.catalog.existingConfigMap }}
        - name: catalog
          configMap:
            name: {{ .Values.catalog.existingConfigMap }}
        {{- end }}
      terminationGracePeriodSeconds: 40
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
