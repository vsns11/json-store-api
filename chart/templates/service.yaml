apiVersion: v1
kind: Service
metadata:
  name: {{ include "json-store-api.fullname" . }}
  labels: {{- include "json-store-api.labels" . | nindent 4 }}
spec:
  selector: {{- include "json-store-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
